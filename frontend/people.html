<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Список людей — Yalix</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand" aria-label="Yalix logo">
          <a href="index.html" class="brand-link">
            <span class="brand-mark">Y</span>
            <span class="brand-text">Yalix</span>
          </a>
          <span class="brand-tag">people</span>
        </div>
        <nav class="nav-links" aria-label="Основная навигация">
          <a href="index.html" class="nav-link">Задачи</a>
          <a href="calendar-view.html" class="nav-link">Календарь</a>
          <a href="teams.html" class="nav-link">Команды</a>
          <a href="people.html" class="nav-link active">Сотрудники</a>
          <a href="personal-cabinet.html" class="nav-link">Кабинет</a>
        </nav>
        <div class="auth-actions">
          <a class="auth-btn login-btn" href="personal-cabinet.html">Личный кабинет</a>
        </div>
      </header>

      <main class="people-page">
        <section class="people-header">
          <div>
            <p class="eyebrow">Пользователи</p>
            <h1>Список людей</h1>
          </div>
          <a class="auth-btn login-btn" href="./index.html">На главную</a>
        </section>

        <section class="people-panel">
          <div class="people-toolbar">
            <button id="refreshPeopleBtn" class="edit-btn" type="button">Обновить список</button>
          </div>

          <div id="peopleLoading" class="people-status">Загрузка пользователей...</div>
          <div id="peopleError" class="people-status error hidden"></div>
          <ul id="peopleList" class="people-list" aria-live="polite"></ul>
        </section>
      </main>

      <footer class="footer-bar">
        <span>Поддержка: <a href="mailto:YalixHelp@gmail.com">YalixHelp@gmail.com</a></span>
        <span class="divider">|</span>
        <a href="https://github.com/Yalalet" target="_blank" rel="noreferrer">github.com/Yalalet</a>
      </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/people.js"></script>
  </body>
</html>
